<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Site Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico">
  <!-- Astryx Typography: Figtree & System Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/codemirror.min.css">
  <link rel="stylesheet" href="vendor/codemirror_dialog.min.css">
  <link rel="stylesheet" href="app.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/codemirror.min.js"></script>
  <script src="vendor/codemirror_dialog.min.js"></script>
  <script src="vendor/codemirror_searchcursor.min.js"></script>
  <script src="vendor/codemirror_markdown.min.js"></script>
  <script src="vendor/codemirror_vim.min.js"></script>
</head>
<body>

  <!-- NAVIGATION -->
  <nav class="app-nav">
    <div class="nav-tabs-wrapper">
      <button class="nav-tab active" data-tab="tab-blog">Posts</button>
      <button class="nav-tab" data-tab="tab-books">Books</button>
      <button class="nav-tab" data-tab="tab-deploy">Deploy</button>
    </div>
    <div class="nav-actions">
      <button id="btn-quick-build" class="btn btn-sm btn-secondary" title="Rebuild static site">Build</button>
      <button id="btn-theme-toggle" class="btn btn-sm btn-icon" title="Toggle theme">🌓</button>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="app-main">

    <!-- ================= TAB: BLOG ================= -->
    <section id="tab-blog" class="tab-panel active">
      <div class="blog-layout">
        <aside class="posts-sidebar">
          <div class="sidebar-header">
            <input type="text" id="post-search" placeholder="Search" class="input-search">
            <button id="btn-new-post" class="btn btn-primary btn-sm">+ New</button>
          </div>
          <div id="posts-list" class="posts-list">
            <div class="loading-state">Loading...</div>
          </div>
        </aside>

        <section class="post-editor-container">
          <div class="metadata-grid">
            <div class="form-group form-title">
              <label>Title</label>
              <input type="text" id="post-title" placeholder="Post title" class="input-text">
            </div>
            <div class="form-group form-date">
              <label>Date</label>
              <input type="date" id="post-date" class="input-text">
            </div>
            <div class="editor-actions">
              <button id="btn-delete-post" class="btn btn-sm btn-danger" style="display:none;" title="Delete this post">Delete</button>
              <button id="btn-save-post" class="btn btn-sm btn-primary" title="Save & rebuild (:w or Ctrl+S)">Save</button>
            </div>
            <div class="form-group form-desc">
              <label>Description</label>
              <input type="text" id="post-desc" placeholder="Short summary" class="input-text">
            </div>
            <div class="form-group form-tags">
              <label>Tags</label>
              <input type="text" id="post-tags" placeholder="linux, c++" class="input-text">
            </div>
          </div>

          <div class="split-editor" id="split-editor-wrap">
            <div class="editor-pane" id="pane-editor">
              <textarea id="post-markdown" placeholder="Write in Markdown..." spellcheck="false"></textarea>
              <span id="vim-mode-display" class="vim-status-indicator">NORMAL</span>
            </div>
            <div class="preview-pane" id="pane-preview">
              <div id="post-preview-render" class="preview-body post-body"></div>
            </div>
          </div>
        </section>
      </div>
    </section>

    <!-- ================= TAB: BOOKS ================= -->
    <section id="tab-books" class="tab-panel">
      <div class="books-container">
        <div class="books-top-card">
          <input type="text" id="book-search" placeholder="Search" class="input-search">
          <div class="segmented-control" id="book-status-control">
            <button class="seg-btn active" data-status="ALL">All</button>
            <button class="seg-btn" data-status="Reading">Reading</button>
            <button class="seg-btn" data-status="Read">Finished</button>
          </div>
          <button id="btn-add-book" class="btn btn-primary btn-sm">+ Add</button>
        </div>

        <div id="books-grid" class="books-grid">
          <div class="loading-state">Loading...</div>
        </div>
      </div>
    </section>

    <!-- ================= TAB: DEPLOY ================= -->
    <section id="tab-deploy" class="tab-panel">
      <div class="deploy-layout">
        <!-- PREVIEW -->
        <div class="preview-frame-wrapper">
          <div class="frame-bar">
            <button id="btn-toggle-server" class="btn btn-xs btn-primary">Start server</button>
            <div class="frame-bar-right">
              <button id="btn-refresh-frame" class="btn btn-xs btn-secondary">Reload</button>
              <button id="btn-open-browser" class="btn btn-xs btn-secondary" style="display:none;">Open ↗</button>
            </div>
          </div>
          <iframe id="preview-iframe" src="about:blank" class="preview-iframe"></iframe>
          <div id="preview-placeholder" class="preview-placeholder">
            <button id="btn-start-preview-direct" class="btn btn-primary">Start preview</button>
          </div>
        </div>

        <!-- GIT -->
        <div class="git-panel">
          <div class="panel-header">
            <span>Changes</span>
            <span id="git-dirty-badge" class="badge-clean">Clean</span>
          </div>
          <div id="git-changes-list" class="git-changes-list">
            <p class="text-muted">No changes.</p>
          </div>

          <div class="git-commit-box">
            <input type="text" id="git-commit-msg" placeholder="Commit message" class="input-text">
            <button id="btn-do-push" class="btn btn-primary">Commit & Push</button>
          </div>

          <div id="error-box" class="error-box" style="display:none;">
            <button id="btn-close-error" class="btn-close" title="Dismiss">✕</button>
            <pre id="error-text"></pre>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ================= BOOK MODAL ================= -->
  <div id="book-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span id="modal-book-title" class="modal-heading">Add Book</span>
        <button id="btn-close-book-modal" class="btn-close">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="book-edit-index" value="">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="modal-book-name" class="input-text">
        </div>
        <div class="form-group">
          <label>Author *</label>
          <input type="text" id="modal-book-author" class="input-text">
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label>Genre</label>
            <input type="text" id="modal-book-genre" class="input-text">
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Status</label>
            <select id="modal-book-status" class="select-filter">
              <option value="Reading">Reading</option>
              <option value="Read">Finished</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label>Rating</label>
            <input type="text" id="modal-book-rating" class="input-text" placeholder="4.5/5">
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Year</label>
            <input type="number" id="modal-book-year" class="input-text" value="2026">
          </div>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="modal-book-notes" rows="4" class="input-textarea"></textarea>
        </div>
        <div class="form-group">
          <label>Quote</label>
          <input type="text" id="modal-book-quote" class="input-text">
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-delete-book" class="btn btn-danger" style="display:none;">Delete</button>
        <button id="btn-cancel-book" class="btn btn-secondary">Cancel</button>
        <button id="btn-save-book-submit" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
