title: Phuc's Portfolio
markdown: kramdown

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/

exclude:
  - manage.py
  - manage.bat
  - build.py
  - build.rb
  - gui.py
  - gui.bat
  - gui.vbs
  - gui_app/
  - package_app.py
  - create_shortcut.ps1
  - requirements.txt
  - dist/
  - build/
  - README.md
  - LICENSE
  - vendor/
  - __pycache__/
